name: streamclass
description: "StreamClass - Advanced Online Learning Platform with Admin Dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.1
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI & Design
  flutter_svg: ^2.0.7
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  cached_network_image: ^3.3.0
  
  # Charts & Analytics
  fl_chart: ^0.63.0
  
  # Video Handling
  video_player: ^2.7.2
  chewie: ^1.7.1
  
  # Image Handling
  image_picker: ^1.0.4
  image_cropper: ^5.0.0
  
  # Notifications
  awesome_notifications: ^0.9.0
  
  # Date & Time
  intl: ^0.19.0
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # Animations
  animation: ^1.0.0
  lottie: ^2.4.0
  
  # File Management
  path_provider: ^2.1.0
  permission_handler: ^11.4.4
  
  # PDF Export
  pdf: ^3.10.4
  printing: ^5.10.0
  
  # CSV Export
  csv: ^6.0.0
  
  # Connectivity
  connectivity_plus: ^5.0.0
  
  # Logging
  logger: ^2.0.0
  
  # Device Info
  device_info_plus: ^9.1.0
  
  # Code Generation (dev only)
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
